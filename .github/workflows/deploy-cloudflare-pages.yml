# hakanyemcilik.com Cloudflare Pages (hakanyemcilik-web) uzerinden yayinlanir.
# Gerekli GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Ayrica: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (build icin)
# Opsiyonel: VITE_ADMIN_EMAILS, SUPABASE_SERVICE_ROLE_KEY (seed workflow icin)

env:
  CF_PAGES_PROJECT: hakanyemcilik-web

name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets yok. hakanyemcilik.com guncellenmez. Bkz. .github/DEPLOY-CLOUDFLARE.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: steps.cf.outputs.configured == 'true'
        run: npm ci

      - name: Sync Cloudflare Pages build config and env vars
        if: steps.cf.outputs.configured == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
        run: |
          PAYLOAD=$(jq -n \
            --arg url "$VITE_SUPABASE_URL" \
            --arg key "$VITE_SUPABASE_ANON_KEY" \
            --arg admin "${VITE_ADMIN_EMAILS:-}" \
            '{
              build_config: {
                build_command: "npm run build",
                destination_dir: "dist",
                root_dir: ""
              },
              deployment_configs: {
                production: {
                  env_vars: (
                    {
                      VITE_SUPABASE_URL: { value: $url },
                      VITE_SUPABASE_ANON_KEY: { value: $key }
                    }
                    + (if $admin != "" then { VITE_ADMIN_EMAILS: { value: $admin } } else {} end)
                  )
                },
                preview: {
                  env_vars: (
                    {
                      VITE_SUPABASE_URL: { value: $url },
                      VITE_SUPABASE_ANON_KEY: { value: $key }
                    }
                    + (if $admin != "" then { VITE_ADMIN_EMAILS: { value: $admin } } else {} end)
                  )
                }
              },
              source: {
                config: {
                  deployments_enabled: false
                }
              }
            }')
          HTTP_CODE=$(curl -sS -o /tmp/cf-response.json -w "%{http_code}" \
            -X PATCH "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")
          cat /tmp/cf-response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Cloudflare project config sync failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Point custom domain to hakanyemcilik-web
        if: steps.cf.outputs.configured == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PROJECTS=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[].name')
          for OLD in $PROJECTS; do
            if [ "$OLD" != "$CF_PAGES_PROJECT" ]; then
              curl -sS -o /tmp/cf-domain-rm.json -w "remove-${OLD}-%{http_code}\n" \
                -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${OLD}/domains/hakanyemcilik.com" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" || true
            fi
          done
          for DOMAIN in hakanyemcilik.com www.hakanyemcilik.com; do
            HTTP_CODE=$(curl -sS -o /tmp/cf-domain-add.json -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}/domains" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${DOMAIN}\"}")
            cat /tmp/cf-domain-add.json
            if [ "$HTTP_CODE" -ge 400 ] && [ "$HTTP_CODE" -ne 409 ]; then
              echo "::warning::Domain ${DOMAIN} attach HTTP ${HTTP_CODE}"
            fi
          done

      - name: Build (dogrulama)
        if: steps.cf.outputs.configured == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify Supabase is baked into build
        if: steps.cf.outputs.configured == 'true'
        run: |
          if ! grep -qE 'https://[a-z0-9]+\.supabase\.co' dist/assets/*.js; then
            echo "::error::Build does not include Supabase project URL. Add secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY."
            exit 1
          fi

      - name: Trigger Cloudflare Pages production build
        if: steps.cf.outputs.configured == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/cf-deploy.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"branch":"main"}')
          cat /tmp/cf-deploy.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Cloudflare production deploy trigger failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Cloudflare deploy skipped
        if: steps.cf.outputs.configured == 'false'
        run: |
          echo "GitHub Pages deploy edildi: https://yigitugurlucimen.github.io/hakanyemcilik/"
          echo "Custom domain icin Cloudflare secret ekleyin veya DNS'i GitHub Pages'e alin (.github/DEPLOY-CLOUDFLARE.md)"
